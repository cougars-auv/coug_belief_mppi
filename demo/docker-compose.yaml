services:
  demo:
    image: frostlab/cougars:belief-mppi-demo
    build:
      context: ..
      dockerfile: demo/Dockerfile.demo
      args:
        - VERSION=${VERSION:-latest}
    container_name: cougars-belief-mppi-demo-ct
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./demo_bag:/demo_bag:ro
    command: >
      ros2 launch coug_belief_mppi demo.launch.py
      play_bag_path:=/demo_bag
      agent_ns:=blue1sim
